<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LanRemote · 局域网遥控面板</title>
<style>
  /* ===== 基础：深色 + 手机竖屏优先 ===== */
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel-2:#1c232c;
    --line:#2a323d;
    --text:#e6edf3;
    --text-dim:#8b949e;
    --accent:#3b82f6;
    --ok:#22c55e;
    --warn:#f59e0b;
    --danger:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100dvh;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    -webkit-user-select:none;user-select:none;
  }
  h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px;}
  h1 span{color:var(--accent);}
  h2{font-size:13px;color:var(--text-dim);margin:18px 4px 8px;font-weight:500;letter-spacing:1px;}

  /* ===== 顶栏 ===== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 6px 10px;
  }
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);transition:background .2s;}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .dot.off{background:var(--danger);}

  /* ===== 按钮网格 ===== */
  .grid{display:grid;gap:10px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:1fr 1fr 1fr;}
  .btn{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    color:var(--text);
    font-size:15px;
    font-family:inherit;
    padding:20px 8px;
    min-height:76px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;
    transition:transform .08s, background .15s, border-color .15s;
    touch-action:manipulation;
  }
  .btn .ico{font-size:24px;line-height:1;}
  .btn .lbl{font-size:14px;font-weight:500;}
  .btn .sub{font-size:11px;color:var(--text-dim);}
  .btn:active{transform:scale(.96);background:var(--panel-2);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.busy{border-color:var(--accent);}
  .btn.ok{border-color:var(--ok);}
  .btn.fail{border-color:var(--danger);animation:shake .3s;}
  .btn.danger{background:#1f1418;border-color:#3d2026;}
  .btn.danger:active{background:#2a181d;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  /* ===== 配对页 ===== */
  .pair{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:70dvh;text-align:center;padding:20px 8px;
  }
  .pair .big{font-size:44px;margin-bottom:6px;}
  .pair .addr{
    font-family:ui-monospace,Consolas,monospace;
    background:var(--panel);border:1px solid var(--line);
    padding:8px 14px;border-radius:10px;font-size:13px;color:var(--accent);
    margin:10px 0 24px;word-break:break-all;
  }
  .pinbox{
    display:flex;gap:10px;justify-content:center;margin-bottom:18px;
  }
  .pinbox input{
    width:52px;height:64px;text-align:center;
    font-size:26px;font-weight:600;color:var(--text);
    background:var(--panel);border:1.5px solid var(--line);border-radius:14px;
    outline:none;font-family:inherit;
    -moz-appearance:textfield;
  }
  .pinbox input:focus{border-color:var(--accent);}
  .pinbox.shake{animation:shake .3s;}
  .btn.primary{
    background:var(--accent);border-color:var(--accent);color:#fff;
    min-width:200px;min-height:52px;padding:12px 24px;font-size:16px;
  }
  .btn.primary:active{background:#2563eb;}
  .hint{font-size:12px;color:var(--text-dim);margin-top:16px;line-height:1.7;}
  .err{color:var(--danger);font-size:13px;min-height:20px;margin-bottom:6px;}

  /* ===== 确认弹窗 ===== */
  .mask{
    position:fixed;inset:0;background:rgba(0,0,0,.62);
    display:none;align-items:center;justify-content:center;
    padding:24px;z-index:50;backdrop-filter:blur(3px);
  }
  .mask.show{display:flex;}
  .dialog{
    background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:24px 20px;width:100%;max-width:340px;
    text-align:center;
  }
  .dialog .ico{font-size:36px;margin-bottom:8px;}
  .dialog .t{font-size:17px;font-weight:600;margin-bottom:8px;}
  .dialog .d{font-size:13px;color:var(--text-dim);line-height:1.6;margin-bottom:20px;}
  .dialog .row{display:flex;gap:10px;}
  .dialog .row .btn{flex:1;min-height:48px;padding:12px 8px;border-radius:12px;font-size:15px;}
  .dialog .confirm{background:var(--danger);border-color:var(--danger);color:#fff;}
  .dialog .confirm:active{background:#dc2626;}

  /* ===== 轻提示 ===== */
  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line);
    color:var(--text);font-size:13px;
    padding:10px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    max-width:88vw;text-align:center;
    z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{border-color:#5b2730;color:#ffb4b4;}

  /* 隐藏工具类 */
  .hide{display:none !important;}

  /* 平板/横屏时限制宽度，避免按钮过大 */
  @media (min-width:640px){
    body{max-width:560px;margin:0 auto;}
  }
</style>
</head>
<body>

<!-- ============ 顶栏 ============ -->
<div class="topbar">
  <h1>Lan<span>Remote</span></h1>
  <div class="status"><div class="dot" id="dot"></div><span id="statusText">未连接</span></div>
</div>

<!-- ============ 配对视图 ============ -->
<section class="pair" id="pairView">
  <div class="big">🖥️</div>
  <div style="font-size:15px;color:var(--text-dim);">输入电脑上显示的 6 位 PIN</div>
  <div class="addr" id="addrText">正在获取地址…</div>

  <div class="err" id="pinErr"></div>
  <div class="pinbox" id="pinBox">
    <input type="tel" inputmode="numeric" maxlength="1" autocomplete="one-time-code">
    <input type="tel" inputmode="numeric" maxlength="1">
    <input type="tel" inputmode="numeric" maxlength="1">
    <input type="tel" inputmode="numeric" maxlength="1">
    <input type="tel" inputmode="numeric" maxlength="1">
    <input type="tel" inputmode="numeric" maxlength="1">
  </div>
  <button class="btn primary" id="pinSubmit">连接</button>

  <div class="hint">
    仅限可信局域网使用<br>
    配对成功后本机会被记住，下次免 PIN
  </div>
</section>

<!-- ============ 遥控面板 ============ -->
<main id="panelView" class="hide">

  <h2>电源</h2>
  <div class="grid g2">
    <button class="btn" data-action="power_lock">
      <span class="ico">🔒</span><span class="lbl">锁屏</span></button>
    <button class="btn" data-action="power_sleep">
      <span class="ico">🌙</span><span class="lbl">休眠</span></button>
    <button class="btn danger" data-action="power_reboot" data-confirm="确认重启电脑？">
      <span class="ico">🔄</span><span class="lbl">重启</span></button>
    <button class="btn danger" data-action="power_shutdown" data-confirm="确认关机？关机后只能到电脑前开机。">
      <span class="ico">⏻</span><span class="lbl">关机</span></button>
  </div>

  <h2>媒体</h2>
  <div class="grid g3">
    <button class="btn" data-action="media_volume_down">
      <span class="ico">🔉</span><span class="lbl">音量−</span></button>
    <button class="btn" data-action="media_mute">
      <span class="ico">🔇</span><span class="lbl">静音</span></button>
    <button class="btn" data-action="media_volume_up">
      <span class="ico">🔊</span><span class="lbl">音量+</span></button>
    <button class="btn" data-action="media_prev">
      <span class="ico">⏮</span><span class="lbl">上一首</span></button>
    <button class="btn" data-action="media_play_pause">
      <span class="ico">⏯</span><span class="lbl">播放/暂停</span></button>
    <button class="btn" data-action="media_next">
      <span class="ico">⏭</span><span class="lbl">下一首</span></button>
  </div>

  <h2>快捷键</h2>
  <div class="grid g2" id="shortcutGrid">
    <!-- 由 config.json 动态填充；取不到时用内置默认 -->
  </div>

  <h2>设备</h2>
  <div class="hint" style="margin-top:0;text-align:left;padding:0 4px;">
    地址：<span id="panelAddr" style="color:var(--accent);font-family:ui-monospace,Consolas,monospace;"></span><br>
    平台：<span id="panelOs">-</span>
  </div>
</main>

<!-- ============ 二次确认弹窗 ============ -->
<div class="mask" id="confirmMask">
  <div class="dialog">
    <div class="ico">⚠️</div>
    <div class="t" id="confirmTitle">确认操作</div>
    <div class="d" id="confirmDesc">此操作会立即执行。</div>
    <div class="row">
      <button class="btn" id="confirmCancel">取消</button>
      <button class="btn confirm" id="confirmOk">确认执行</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
 * LanRemote 前端：纯原生 JS，无任何依赖
 * 协议：
 *   GET  /api/pair   -> {ok:true, token} 或 {ok:false, need_pin:true}
 *   POST /api/pair   {pin} -> {ok:true, token} / 403 {ok:false}
 *   WS   /ws         发 {"action":"...", "cmd":?} 收 {"type":"result",...}
 * ============================================================ */

const $ = (id) => document.getElementById(id);

const el = {
  dot: $("dot"),
  statusText: $("statusText"),
  pairView: $("pairView"),
  panelView: $("panelView"),
  addrText: $("addrText"),
  panelAddr: $("panelAddr"),
  panelOs: $("panelOs"),
  pinErr: $("pinErr"),
  pinBox: $("pinBox"),
  pinSubmit: $("pinSubmit"),
  shortcutGrid: $("shortcutGrid"),
  confirmMask: $("confirmMask"),
  confirmTitle: $("confirmTitle"),
  confirmDesc: $("confirmDesc"),
  confirmOk: $("confirmOk"),
  confirmCancel: $("confirmCancel"),
  toast: $("toast"),
};

const state = {
  ws: null,
  token: "",
  online: false,
  reconnectTimer: null,
  reconnectDelay: 1000,
  pendingConfirm: null,   // 等待二次确认的动作
  lastAction: null,
};

/* ---------- 小工具 ---------- */

function setStatus(text, cls) {
  el.statusText.textContent = text;
  el.dot.className = "dot" + (cls ? " " + cls : "");
}

let toastTimer = null;
function toast(msg, isErr) {
  el.toast.textContent = msg;
  el.toast.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.toast.className = "toast"; }, 1800);
}

/* ---------- 地址显示 ---------- */

function showAddress() {
  const addr = location.origin;
  el.addrText.textContent = addr;
  el.panelAddr.textContent = addr;
}

/* ---------- PIN 输入框行为 ---------- */

const pinInputs = Array.from(el.pinBox.querySelectorAll("input"));

function readPin() {
  return pinInputs.map((i) => i.value.replace(/\D/g, "")).join("");
}

function clearPin() {
  pinInputs.forEach((i) => { i.value = ""; });
  pinInputs[0].focus();
}

function bindPinInputs() {
  pinInputs.forEach((input, idx) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 1);
      if (input.value && idx < pinInputs.length - 1) {
        pinInputs[idx + 1].focus();
      }
      el.pinErr.textContent = "";
      if (readPin().length === 6) {
        // 填满自动提交，减少一次点击
        setTimeout(submitPin, 80);
      }
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && idx > 0) {
        pinInputs[idx - 1].focus();
        pinInputs[idx - 1].value = "";
        e.preventDefault();
      }
      if (e.key === "Enter") submitPin();
    });
    input.addEventListener("paste", (e) => {
      const txt = (e.clipboardData || window.clipboardData).getData("text") || "";
      const digits = txt.replace(/\D/g, "").slice(0, 6);
      if (digits) {
        e.preventDefault();
        digits.split("").forEach((d, i) => { if (pinInputs[i]) pinInputs[i].value = d; });
        if (digits.length === 6) setTimeout(submitPin, 80);
        else pinInputs[Math.min(digits.length, 5)].focus();
      }
    });
  });
}

/* ---------- 配对 ---------- */

async function probePair() {
  try {
    const r = await fetch("/api/pair", { cache: "no-store" });
    const data = await r.json();
    if (data.ok && data.token) {
      state.token = data.token;
      enterPanel();
      return;
    }
  } catch (e) {
    // 网络异常时仍显示 PIN 页，用户可重试
  }
  showPairView();
}

function showPairView() {
  el.pairView.classList.remove("hide");
  el.panelView.classList.add("hide");
  setStatus("等待配对", "off");
  showAddress();
  setTimeout(() => pinInputs[0].focus(), 300);
}

let submitting = false;
async function submitPin() {
  const pin = readPin();
  if (pin.length !== 6) {
    el.pinErr.textContent = "请输入完整的 6 位 PIN";
    return;
  }
  if (submitting) return;
  submitting = true;
  el.pinSubmit.disabled = true;
  el.pinSubmit.textContent = "验证中…";
  try {
    const r = await fetch("/api/pair", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin }),
    });
    const data = await r.json().catch(() => ({}));
    if (r.ok && data.ok && data.token) {
      state.token = data.token;
      enterPanel();
      toast("配对成功");
    } else {
      el.pinErr.textContent = "PIN 不正确，请查看电脑终端显示的 6 位数字";
      el.pinBox.classList.add("shake");
      setTimeout(() => el.pinBox.classList.remove("shake"), 320);
      clearPin();
    }
  } catch (e) {
    el.pinErr.textContent = "无法连接服务，请确认电脑端仍在运行";
  } finally {
    submitting = false;
    el.pinSubmit.disabled = false;
    el.pinSubmit.textContent = "连接";
  }
}

/* ---------- 面板 ---------- */

function enterPanel() {
  el.pairView.classList.add("hide");
  el.panelView.classList.remove("hide");
  showAddress();
  loadConfig();
  connectWs();
}

async function loadConfig() {
  // 默认按钮：即使 /api/config 不可用，面板也能用
  let buttons = [
    { id: "s1", label: "显示桌面", cmd: "win+d" },
    { id: "s2", label: "切换窗口", cmd: "alt+tab" },
    { id: "s3", label: "复制", cmd: "ctrl+c" },
    { id: "s4", label: "粘贴", cmd: "ctrl+v" },
    { id: "s5", label: "全选", cmd: "ctrl+a" },
    { id: "s6", label: "保存", cmd: "ctrl+s" },
  ];
  try {
    const r = await fetch("/api/config", { cache: "no-store" });
    const data = await r.json();
    if (Array.isArray(data.shortcut_buttons) && data.shortcut_buttons.length) {
      buttons = data.shortcut_buttons;
    }
    if (data.os) el.panelOs.textContent = data.os;
  } catch (e) {
    el.panelOs.textContent = "未知";
  }
  renderShortcuts(buttons);
}

function renderShortcuts(buttons) {
  el.shortcutGrid.innerHTML = "";
  buttons.forEach((b) => {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.dataset.action = "shortcut_send";
    btn.dataset.cmd = b.cmd || "";
    btn.innerHTML =
      '<span class="ico">⌨️</span>' +
      '<span class="lbl"></span>' +
      '<span class="sub"></span>';
    btn.querySelector(".lbl").textContent = b.label || b.cmd || "快捷键";
    btn.querySelector(".sub").textContent = b.cmd || "";
    el.shortcutGrid.appendChild(btn);
  });
}

/* ---------- WebSocket ---------- */

function connectWs() {
  if (state.ws && (state.ws.readyState === WebSocket.OPEN ||
                   state.ws.readyState === WebSocket.CONNECTING)) {
    return;
  }
  clearTimeout(state.reconnectTimer);
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  let ws;
  try {
    ws = new WebSocket(proto + location.host + "/ws");
  } catch (e) {
    setStatus("连接失败", "off");
    scheduleReconnect();
    return;
  }
  state.ws = ws;
  setStatus("连接中…", "");

  ws.onopen = () => {
    state.online = true;
    state.reconnectDelay = 1000;
    setStatus("已连接", "on");
  };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === "result") {
      finishAction(msg.action, msg.ok, msg.detail);
    }
  };

  ws.onclose = () => {
    state.online = false;
    setStatus("连接断开", "off");
    // 未配对（403）时不再无限重连，回到 PIN 页
    if (!state.token) { showPairView(); return; }
    scheduleReconnect();
  };

  ws.onerror = () => {
    setStatus("连接异常", "off");
  };
}

function scheduleReconnect() {
  clearTimeout(state.reconnectTimer);
  state.reconnectTimer = setTimeout(() => {
    // 指数退避，最长 15 秒
    state.reconnectDelay = Math.min(state.reconnectDelay * 1.6, 15000);
    connectWs();
  }, state.reconnectDelay);
}

/* ---------- 发指令 ---------- */

function findButton(action, cmd) {
  const nodes = document.querySelectorAll("[data-action]");
  for (const n of nodes) {
    if (n.dataset.action !== action) continue;
    if (action === "shortcut_send" && (n.dataset.cmd || "") !== (cmd || "")) continue;
    return n;
  }
  return null;
}

function markBusy(action, cmd) {
  const btn = findButton(action, cmd);
  if (!btn) return;
  btn.disabled = true;
  btn.classList.remove("ok", "fail");
  btn.classList.add("busy");
  state.lastAction = { action, cmd, el: btn };
}

function finishAction(action, ok, detail) {
  const last = state.lastAction;
  if (!last || last.action !== action) {
    toast(ok ? "已执行" : ("失败：" + (detail || "未知错误")), !ok);
    return;
  }
  const btn = last.el;
  btn.disabled = false;
  btn.classList.remove("busy");
  btn.classList.add(ok ? "ok" : "fail");
  setTimeout(() => {
    btn.classList.remove("ok", "fail");
  }, 900);
  if (ok) {
    toast("已执行");
  } else {
    toast("失败：" + (detail || "未知错误"), true);
  }
  state.lastAction = null;
}

function sendAction(action, cmd) {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
    toast("未连接到电脑，正在重连…", true);
    connectWs();
    return;
  }
  const payload = { action };
  if (action === "shortcut_send") payload.cmd = cmd || "";
  markBusy(action, cmd);
  try {
    state.ws.send(JSON.stringify(payload));
  } catch (e) {
    toast("发送失败", true);
  }
  // 兜底：3.5 秒没收到结果就复位按钮，避免一直禁用
  setTimeout(() => {
    const last = state.lastAction;
    if (last && last.action === action) {
      last.el.disabled = false;
      last.el.classList.remove("busy");
      last.el.classList.add("fail");
      setTimeout(() => last.el.classList.remove("fail"), 900);
      state.lastAction = null;
    }
  }, 3500);
}

/* ---------- 二次确认 ---------- */

function askConfirm(text, onOk) {
  state.pendingConfirm = onOk;
  el.confirmDesc.textContent = text || "此操作会立即执行。";
  el.confirmMask.classList.add("show");
}

function closeConfirm() {
  state.pendingConfirm = null;
  el.confirmMask.classList.remove("show");
}

el.confirmCancel.addEventListener("click", closeConfirm);
el.confirmOk.addEventListener("click", () => {
  const cb = state.pendingConfirm;
  closeConfirm();
  if (typeof cb === "function") cb();
});
el.confirmMask.addEventListener("click", (e) => {
  if (e.target === el.confirmMask) closeConfirm();
});

/* ---------- 全局点击代理 ---------- */

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  const action = btn.dataset.action;
  const cmd = btn.dataset.cmd || "";
  const confirmText = btn.dataset.confirm;

  if (confirmText) {
    // 危险操作：必须先弹二次确认
    askConfirm(confirmText, () => sendAction(action, cmd));
    return;
  }
  sendAction(action, cmd);
});

/* ---------- 启动 ---------- */

el.pinSubmit.addEventListener("click", submitPin);
bindPinInputs();
showAddress();
setStatus("连接中…", "");
probePair();
